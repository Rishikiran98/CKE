name: Security Scan

on:
  push:
    branches: [main, dev]
  # This ran only on push to main, so the scan could never block a pull
  # request: a change introducing a finding merged green and the failure
  # appeared afterwards, on a branch nobody was gating.
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the development tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Bandit Security Scan
        run: bandit -c bandit.yaml -r cke scripts
