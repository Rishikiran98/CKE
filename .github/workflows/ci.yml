name: CKE CI

on:
  push:
    branches: [main, dev]
  # Unrestricted: this used to be `branches: [main]` while push covered
  # [main, dev], so a pull request into dev ran no tests, no coverage floor
  # and no demo — only the linters. Green there meant black and flake8 passed.
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Read-only by default. Nothing here needs to write to the repository, and a
# job that cannot write cannot be turned into one that does by a change to a
# step it runs.
permissions:
  contents: read

# A superseded run tells nobody anything, and holds a runner while it says it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the package with its development tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage, failing under the floor
        run: pytest -q --cov --cov-report=term-missing

      - name: Run the demo and assert on its answer
        # Not `python demo.py | tee demo.out`: the default shell is `bash -e`
        # without pipefail, so the pipeline reported tee's status and the
        # demo's own exit code was discarded. The demo could raise after
        # printing its answer and every grep below would still match.
        run: |
          set -o pipefail
          python demo.py | tee demo.out
          grep -Fxq "Answer: Turkey" demo.out
          grep -Fq "Rule applied located_in_transitivity" demo.out
          grep -Fq "No component degraded during this run." demo.out
