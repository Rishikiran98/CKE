[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cke"
description = "Convergent Knowledge Engine: knowledge-graph extraction, path retrieval and reasoning for question answering"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# The version lives in cke/version.py, the dependency list in
# requirements.txt and the development tools in requirements-dev.txt; all
# are read from there so each is written in one place.
dynamic = ["version", "dependencies", "optional-dependencies"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Repository = "https://github.com/Rishikiran98/CKE"

# Only the entry points that live inside the package. The drivers under
# scripts/ and demo.py are files outside it and stay invocable as files.
[project.scripts]
cke-eval = "cke.evaluation.run_eval:main"
cke-experiment = "cke.experiments.run_experiment:main"
cke-reasoning-eval = "cke.experiments.reasoning_eval_pipeline:main"
cke-retrieval-eval = "cke.experiments.retrieval_eval_pipeline:main"

[tool.setuptools.dynamic]
version = { attr = "cke.version.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.dynamic.optional-dependencies]
dev = { file = ["requirements-dev.txt"] }

[tool.setuptools.packages.find]
include = ["cke*"]
# The in-package test suite is not part of the library, and cke/logs is a
# runtime output directory that has no business in a wheel.
exclude = ["cke.tests*", "cke.logs*"]

[tool.setuptools.package-data]
# relations.yaml is read from beside its module at runtime.
"cke.schema" = ["*.yaml"]

[tool.mypy]
# The type-checked module list. It is a ratchet: a module is added when it
# checks clean and is never removed. tests/test_typecheck_ratchet.py pins
# the floor, so dropping a module fails a test a reviewer can see.
#
# follow_imports = "silent" is what makes a small list possible: a listed
# module's imports are analysed for the types they provide, but errors
# inside an unlisted module are not reported until that module is listed.
# ignore_missing_imports covers third-party packages without stubs.
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_configs = true
files = [
    "cke/models.py",
    "cke/pipeline/types.py",
    "cke/retrieval/path_types.py",
    "cke/schema",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.bandit]
exclude_dirs = ["cke/tests", "tests"]
skips = ["B101"]

