[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cke"
description = "Convergent Knowledge Engine: knowledge-graph extraction, path retrieval and reasoning for question answering"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# The version lives in cke/version.py, the dependency list in
# requirements.txt and the development tools in requirements-dev.txt; all
# are read from there so each is written in one place.
dynamic = ["version", "dependencies", "optional-dependencies"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Repository = "https://github.com/Rishikiran98/CKE"

# Only the entry points that live inside the package. The drivers under
# scripts/ and demo.py are files outside it and stay invocable as files.
[project.scripts]
cke-eval = "cke.evaluation.run_eval:main"
cke-experiment = "cke.experiments.run_experiment:main"
cke-reasoning-eval = "cke.experiments.reasoning_eval_pipeline:main"
cke-retrieval-eval = "cke.experiments.retrieval_eval_pipeline:main"

[tool.setuptools.dynamic]
version = { attr = "cke.version.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.dynamic.optional-dependencies]
dev = { file = ["requirements-dev.txt"] }

[tool.setuptools.packages.find]
include = ["cke*"]
# cke/logs is a runtime output directory that has no business in a wheel.
exclude = ["cke.logs*"]

[tool.setuptools.package-data]
# relations.yaml is read from beside its module at runtime.
"cke.schema" = ["*.yaml"]

[tool.mypy]
# The type-checked module list. It is a ratchet: a module is added when it
# checks clean and is never removed. tests/test_typecheck_ratchet.py pins
# the floor, so dropping a module fails a test a reviewer can see.
#
# follow_imports = "silent" is what makes a small list possible: a listed
# module's imports are analysed for the types they provide, but errors
# inside an unlisted module are not reported until that module is listed.
# ignore_missing_imports covers third-party packages without stubs.
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_configs = true
files = [
    # Declaration-only modules, where the ratchet started.
    "cke/models.py",
    "cke/pipeline/types.py",
    "cke/retrieval/path_types.py",
    "cke/schema",
    # Logic. The list held six files, every one of them a dataclass or enum
    # module, so nothing that decides anything was checked. These are the
    # modules that already pass; the rest of the package is the work ahead.
    "cke/diagnostics.py",
    "cke/datasets/hotpot_loader.py",
    "cke/datasets/locomo_loader.py",
    "cke/datasets/musique_loader.py",
    "cke/datasets/wiki2_loader.py",
    "cke/evaluation/span_qa.py",
    "cke/evaluation/token_counter.py",
    "cke/observability/token_tracker.py",
    "cke/reasoning/reasoner_adapter.py",
    "cke/reasoning/verifier.py",
    "cke/trust/confidence_calibrator.py",
]

[tool.pytest.ini_options]
# There was no pytest configuration at all. A developer running plain `pytest`
# got no coverage and no floor: the floor lived in one string in ci.yml, so
# the gate existed only on the runner and nowhere a contributor would meet it.
testpaths = ["tests"]
addopts = "-q --cov --cov-report=term-missing --strict-markers --strict-config"
# --strict-markers: a typo in a marker name is an error, not a silently
# unregistered marker that applies to nothing. needs_download is the only marker
# this suite defines and it gates the network guard, so a misspelling of it
# would quietly grant network access.
markers = [
    "needs_download: loads a real model or tokenizer and may use the network",
]
filterwarnings = [
    "error",
]

[tool.coverage.run]
# scripts/ is measured. It was not, and it holds the benchmark driver and the
# downloaders — the code that produces every number this project reports —
# so the floor guarded the library while the drivers went unmeasured.
source = ["cke", "scripts"]
branch = true

[tool.coverage.report]
# The floor. It only rises within a scope, and tests/test_coverage_floor.py
# pins both the floor and the scope, so lowering either fails a test a
# reviewer can see.
#
# It reads lower than the 82.5 it replaced, and it is not the same
# measurement: 82.5 was statement coverage of cke/ alone, this is branch
# coverage of cke/ and scripts/ together. Widening what is measured and
# counting branches both add uncovered ground; the number went down because
# it now describes more of the repository, which is the point.
fail_under = 78.0
precision = 2
skip_covered = true

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

